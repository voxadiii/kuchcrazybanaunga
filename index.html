<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Tinu ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Quicksand', sans-serif;
    user-select: none;
    background: #0f172a;
    color: #fff;
    overflow-x: hidden;
  }

  /* ── PAGE SYSTEM ─────────────────────── */
  .page {
    display: none;
    width: 100vw;
    min-height: 100vh;
    position: relative;
    box-sizing: border-box;
  }
  .page.active {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── PAGE 1: BOTANICAL GARDEN ────────── */
  #page-1 {
    background: linear-gradient(180deg, #120309 0%, #280a18 50%, #0d1a0d 100%);
    justify-content: space-between;
    padding: 40px 20px 20px;
  }

  canvas#garden-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .garden-header {
    z-index: 5;
    text-align: center;
    margin-top: 5vh;
  }
  .garden-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 7vw, 3.8rem);
    color: #ffe6eb;
    text-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
  }
  .garden-sub {
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    color: #ffb3c1;
    margin-top: 6px;
  }

  .click-btn {
    z-index: 10;
    background: linear-gradient(135deg, #ff4d6d, #c9184a);
    color: #fff;
    border: none;
    padding: 14px 40px;
    border-radius: 35px;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(230, 50, 100, 0.45);
    transition: transform 0.2s ease;
    margin-bottom: 80px;
  }
  .click-btn:active { transform: scale(0.94); }

  /* ── PAGE 2: NATURAL CASTLE & SUNSET ── */
  #page-2 {
    height: 100vh;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
  }

  canvas#landscape-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  .landscape-header {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    padding: 0 16px;
  }
  .landscape-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 6vw, 3rem);
    color: #fffdfa;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .landscape-sub {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: #ffeedd;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }

  .back-btn-top {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    backdrop-filter: blur(5px);
  }

  /* ── WATERMARK FOOTER ────────────────── */
  .aditya-watermark {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    font-family: 'Quicksand', sans-serif;
    pointer-events: none;
    z-index: 25;
  }
  .light-mark { color: rgba(255, 255, 255, 0.5); text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
</style>
</head>
<body>

<audio id="bgm" loop preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- ── PAGE 1: GARDEN ── -->
<div class="page active" id="page-1">
  <canvas id="garden-canvas"></canvas>

  <div class="garden-header">
    <h1 class="garden-title">For My Tinu 🌸</h1>
    <p class="garden-sub">A special garden built just for you...</p>
  </div>

  <button type="button" class="click-btn" onclick="goToPage(2)">Click Here ✨</button>

  <div class="aditya-watermark light-mark">
    Crafted with all my love • © Aditya | All Rights Reserved
  </div>
</div>

<!-- ── PAGE 2: NATURAL CASTLE & SUNSET ── -->
<div class="page" id="page-2">
  <button type="button" class="back-btn-top" onclick="goToPage(1)">← Back</button>

  <div class="landscape-header">
    <h2 class="landscape-title">Our Endless Horizon ❤️</h2>
    <p class="landscape-sub">Watching the sun set over our dream castle together...</p>
  </div>

  <canvas id="landscape-canvas"></canvas>

  <div class="aditya-watermark light-mark">
    Crafted with all my love • © Aditya | All Rights Reserved
  </div>
</div>

<script>
/* ── AUDIO & PAGE NAVIGATION ───────────── */
const bgm = document.getElementById('bgm');

function goToPage(num) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + num);
  if (target) {
    target.classList.add('active');
  }

  if (num === 2) {
    bgm.play().catch(() => {});
    initLandscape();
  }
}

/* ── PAGE 1: BLOOMING BOTANICAL GARDEN ──── */
const gCanvas = document.getElementById('garden-canvas');
const gCtx = gCanvas.getContext('2d');
let gW, gH;

function resizeGarden() {
  gW = gCanvas.width = window.innerWidth;
  gH = gCanvas.height = window.innerHeight;
  drawGarden();
}
window.addEventListener('resize', resizeGarden);

const petals = Array.from({length: 45}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 4 + 2,
  vy: Math.random() * 0.8 + 0.3,
  vx: Math.sin(Math.random() * Math.PI) * 0.5,
  alpha: Math.random() * 0.6 + 0.3
}));

function drawGarden() {
  gCtx.clearRect(0, 0, gW, gH);

  // Deep night garden gradient
  const grad = gCtx.createLinearGradient(0, 0, 0, gH);
  grad.addColorStop(0, '#12040a');
  grad.addColorStop(0.6, '#210814');
  grad.addColorStop(1, '#08140a');
  gCtx.fillStyle = grad;
  gCtx.fillRect(0, 0, gW, gH);

  // Draw Stems & Flowers
  const flowerCount = Math.floor(gW / 24);
  for (let i = 0; i < flowerCount; i++) {
    const fx = (i + 0.5) * (gW / flowerCount) + (Math.sin(i) * 8);
    const stemHeight = 120 + Math.sin(i * 1.5) * 40;
    const fy = gH - stemHeight;

    // Green Stem
    gCtx.beginPath();
    gCtx.moveTo(fx, gH);
    gCtx.quadraticCurveTo(fx + Math.sin(i) * 10, gH - stemHeight / 2, fx, fy);
    gCtx.strokeStyle = '#2d6a4f';
    gCtx.lineWidth = 3;
    gCtx.stroke();

    // Blooming Petals
    const colors = ['#ff4d6d', '#ff8fa3', '#ffb3c1', '#ffccd5', '#ff758f'];
    const pColor = colors[i % colors.length];

    gCtx.fillStyle = pColor;
    for (let p = 0; p < 6; p++) {
      const angle = (p * Math.PI) / 3;
      const px = fx + Math.cos(angle) * 12;
      const py = fy + Math.sin(angle) * 12;
      gCtx.beginPath();
      gCtx.arc(px, py, 7, 0, Math.PI * 2);
      gCtx.fill();
    }
    // Flower Center
    gCtx.beginPath();
    gCtx.arc(fx, fy, 6, 0, Math.PI * 2);
    gCtx.fillStyle = '#ffb703';
    gCtx.fill();
  }

  // Floating Petals
  petals.forEach(p => {
    gCtx.beginPath();
    gCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    gCtx.fillStyle = `rgba(255, 180, 200, ${p.alpha})`;
    gCtx.fill();

    p.y += p.vy;
    p.x += p.vx;
    if (p.y > gH) { p.y = -10; p.x = Math.random() * gW; }
  });

  requestAnimationFrame(drawGarden);
}
resizeGarden();


/* ── PAGE 2: REALISTIC SUNSET CASTLE & COUPLE ── */
const lCanvas = document.getElementById('landscape-canvas');
const lCtx = lCanvas.getContext('2d');
let lW, lH;

function initLandscape() {
  lW = lCanvas.width = window.innerWidth;
  lH = lCanvas.height = window.innerHeight;
  drawNaturalScene();
}
window.addEventListener('resize', initLandscape);

function drawNaturalScene() {
  lCtx.clearRect(0, 0, lW, lH);

  // 1. Vibrant Natural Sunset Sky (Golden Hour Gradient)
  const skyGrad = lCtx.createLinearGradient(0, 0, 0, lH * 0.7);
  skyGrad.addColorStop(0, '#4a1525');     // Deep dusk purple
  skyGrad.addColorStop(0.35, '#c94b32');  // Crimson orange
  skyGrad.addColorStop(0.65, '#f39c12');  // Vibrant amber
  skyGrad.addColorStop(1, '#f1c40f');     // Warm golden horizon
  lCtx.fillStyle = skyGrad;
  lCtx.fillRect(0, 0, lW, lH);

  // 2. Setting Sun with Glowing Rays
  const sunX = lW * 0.72;
  const sunY = lH * 0.42;

  // Sun Glow
  const sunGlow = lCtx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 180);
  sunGlow.addColorStop(0, 'rgba(255, 255, 250, 1)');
  sunGlow.addColorStop(0.2, 'rgba(255, 220, 120, 0.9)');
  sunGlow.addColorStop(0.6, 'rgba(243, 156, 18, 0.4)');
  sunGlow.addColorStop(1, 'rgba(243, 156, 18, 0)');
  lCtx.fillStyle = sunGlow;
  lCtx.beginPath();
  lCtx.arc(sunX, sunY, 180, 0, Math.PI * 2);
  lCtx.fill();

  // Sun Core
  lCtx.beginPath();
  lCtx.arc(sunX, sunY, 28, 0, Math.PI * 2);
  lCtx.fillStyle = '#ffffff';
  lCtx.fill();

  // 3. Distant Mountains & Cliffs (Iceland/Greenland Vibe)
  lCtx.fillStyle = '#2c1810';
  lCtx.beginPath();
  lCtx.moveTo(0, lH * 0.55);
  lCtx.lineTo(lW * 0.25, lH * 0.45);
  lCtx.lineTo(lW * 0.55, lH * 0.52);
  lCtx.lineTo(lW * 0.85, lH * 0.42);
  lCtx.lineTo(lW, lH * 0.5);
  lCtx.lineTo(lW, lH);
  lCtx.lineTo(0, lH);
  lCtx.fill();

  // 4. Grassy Hilltop Base & Cliff Overlook
  const hillGrad = lCtx.createLinearGradient(0, lH * 0.5, 0, lH);
  hillGrad.addColorStop(0, '#3a5a40');  // Lush green
  hillGrad.addColorStop(0.5, '#152c1e'); // Deep shadow green
  hillGrad.addColorStop(1, '#0a140d');   // Dark base
  lCtx.fillStyle = hillGrad;

  lCtx.beginPath();
  lCtx.moveTo(0, lH * 0.65);
  lCtx.quadraticCurveTo(lW * 0.35, lH * 0.52, lW * 0.7, lH * 0.68);
  lCtx.quadraticCurveTo(lW * 0.85, lH * 0.72, lW, lH * 0.62);
  lCtx.lineTo(lW, lH);
  lCtx.lineTo(0, lH);
  lCtx.fill();

  // 5. Stone Castle Facing the Sun
  const cX = lW * 0.65;
  const cY = lH * 0.42;
  const cScale = Math.min(lW, lH) / 650;

  // Castle Shadows & Warm Highlights
  lCtx.fillStyle = '#1c1917'; // Dark stone base

  // Central Keep
  lCtx.fillRect(cX - 40 * cScale, cY, 80 * cScale, 90 * cScale);
  
  // Left Tower
  lCtx.fillRect(cX - 75 * cScale, cY - 20 * cScale, 35 * cScale, 110 * cScale);
  // Right Tower
  lCtx.fillRect(cX + 40 * cScale, cY - 10 * cScale, 35 * cScale, 100 * cScale);

  // Turret Roofs
  lCtx.fillStyle = '#292524';
  lCtx.beginPath();
  lCtx.moveTo(cX - 80 * cScale, cY - 20 * cScale);
  lCtx.lineTo(cX - 57.5 * cScale, cY - 60 * cScale);
  lCtx.lineTo(cX - 35 * cScale, cY - 20 * cScale);
  lCtx.fill();

  lCtx.beginPath();
  lCtx.moveTo(cX + 35 * cScale, cY - 10 * cScale);
  lCtx.lineTo(cX + 57.5 * cScale, cY - 50 * cScale);
  lCtx.lineTo(cX + 80 * cScale, cY - 10 * cScale);
  lCtx.fill();

  // Castle Arched Windows lit by Sunset
  lCtx.fillStyle = '#f59e0b';
  lCtx.fillRect(cX - 10 * cScale, cY + 20 * cScale, 20 * cScale, 30 * cScale);
  lCtx.fillRect(cX - 63 * cScale, cY + 15 * cScale, 10 * cScale, 18 * cScale);
  lCtx.fillRect(cX + 53 * cScale, cY + 20 * cScale, 10 * cScale, 18 * cScale);

  // 6. Two Fictional Silhouette Characters Sitting Together on the Overlook Hill
  const seatX = lW * 0.28;
  const seatY = lH * 0.61;

  // Boy Silhouette (Aditya) leaning close
  lCtx.fillStyle = '#0f172a';
  lCtx.beginPath();
  lCtx.arc(seatX - 12 * cScale, seatY - 28 * cScale, 11 * cScale, 0, Math.PI * 2); // Head
  lCtx.fill();

  lCtx.beginPath();
  lCtx.ellipse(seatX - 12 * cScale, seatY - 5 * cScale, 13 * cScale, 20 * cScale, -0.1, 0, Math.PI * 2); // Body
  lCtx.fill();

  // Girl Silhouette (Tinu) leaning her head on his shoulder
  lCtx.fillStyle = '#1e1b4b';
  lCtx.beginPath();
  lCtx.arc(seatX + 6 * cScale, seatY - 25 * cScale, 10 * cScale, 0, Math.PI * 2); // Head
  lCtx.fill();

  lCtx.beginPath();
  lCtx.ellipse(seatX + 8 * cScale, seatY - 4 * cScale, 12 * cScale, 18 * cScale, 0.15, 0, Math.PI * 2); // Body
  lCtx.fill();

  // Floating Heart Glow above them
  lCtx.fillStyle = '#ef4444';
  lCtx.shadowColor = '#f87171';
  lCtx.shadowBlur = 12;
  lCtx.beginPath();
  lCtx.arc(seatX - 2 * cScale, seatY - 48 * cScale, 6 * cScale, 0, Math.PI * 2);
  lCtx.fill();
  lCtx.shadowBlur = 0;
}
</script>
</body>
</html>
